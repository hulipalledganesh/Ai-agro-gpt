<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | AGRO-GPT</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="auth-wrapper">
        <div class="auth-container">
            <div class="auth-header">
                <h1>🌱 AGRO-GPT</h1>
                <p>Your AI Farming Companion</p>
            </div>
            <form id="registerForm" class="form-box" onsubmit="handleAuth(event, 'register')">
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" id="regName" placeholder="Ganesh Hulipalled" required>
                </div>
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" id="regEmail" placeholder="ganesh17688@gmail.com" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="regPassword" placeholder="Create a strong password" required>
                </div>
                <button type="submit" class="submit-btn">Create Account</button>
                <div class="auth-switch">
                    Already have an account? <a href="login.html">Login here</a>
                </div>
            </form>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
